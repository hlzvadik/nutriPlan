spring.application.name=nutriPlan


spring.profiles.active=demo


#JWT
jwt.secret.access=${JWT_ACCESS_SECRET}
jwt.secret.refresh=${JWT_REFRESH_SECRET}

jwt.expiration.access=1200000
jwt.expiration.refresh=2592000000
#

#DB
spring.datasource.url=jdbc:postgresql://localhost:5432/nutriplan_db
spring.datasource.username=${DB_USERNAME:vadik}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#
